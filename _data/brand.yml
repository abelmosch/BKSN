en:
  short_pitch: "The social app for a yoga practice you want to return to."
  slogan: "Build a yoga practice you want to return to"
  closing: "Find your balance. Keep going."
  what_title: "What is Bakasana?"
  what_lede: "Five paths, plus Free Training. Balance, strength, holds, free practice, rest, and a history you can return to."
  expert_teaser: "Bakasana’s practice philosophy is shaped by yoga trainer and product visionary Alena Tkacheva."

ru:
  short_pitch: "Социальное приложение для практики йоги, к которой хочется возвращаться."
  long_pitch: "Отмечайте каждую практику, вступайте в челленджи, соревнуйтесь с друзьями и поднимайтесь в рейтинге."
  slogan: "Возвращайтесь к практике снова и снова."
  closing: "Найдите баланс. Продолжайте."
  h1: "Социальное приложение для практики йоги, к которой хочется возвращаться."
  what_title: "Bakasana — приложение для тех, кто хочет сделать йогу регулярной частью своей жизни."
  what_lede: "Пять направлений плюс Free Training. Баланс, сила, удержание, свободная практика, отдых и история, к которой можно вернуться."
  expert_teaser: "Философию практики Bakasana формирует тренер по йоге и продуктовый визионер Алёна Ткачева."

expert:
  name: Alena Tkacheva
  name_ru: Алёна Ткачева
  job_title: Yoga Trainer and Product Visionary
  job_title_ru: Практик йоги и тренер, продуктовый визионер
  bio_short: "Alena Tkacheva is a yoga practitioner and trainer, the inspiration behind Bakasana, and the app’s product visionary."
  bio_short_ru: "Алёна Ткачева — практик йоги и тренер, идейный вдохновитель и продуктовый визионер Bakasana."
  bio_long: "She shaped how Bakasana treats regular practice: five paths stay complementary—balance, strength, holds, free movement, and recovery—plus Free Training for any other session. Progress tracking stays honest, private, and useful over time. As product visionary, she keeps the app a place to return to practice, with people, rather than a workout gimmick or sequence machine."
  bio_long_ru: "Она сформировала подход Bakasana к регулярной практике: пять направлений остаются взаимодополняющими — баланс, сила, удержание, свободное движение и восстановление, — плюс Free Training для любой другой тренировки. Отслеживание прогресса остаётся честным, приватным и полезным со временем. Как продуктовый визионер, она удерживает Bakasana местом, куда возвращаются к практике и к людям, а не приложением с трюками для тренировок или автоматически собранными последовательностями."
  photo: "/assets/images/program_bakasana_onboarding.jpg"
  instagram: "https://www.instagram.com/aly.yogaa/"
  youtube: "https://www.youtube.com/@DaYogaAlena"
  about_anchor: alena-tkacheva
