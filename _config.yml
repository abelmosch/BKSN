title: Bakasana
description: "The social app for a yoga practice you want to return to."
description_ru: "Социальное приложение для практики йоги, к которой хочется возвращаться."
url: https://bakasana.app
baseurl: ""
production_url: https://bakasana.app

app:
  version: 2.3.12
  build: 59
  category: HealthApplication
  operating_systems: "iOS, Android"
  stores:
    ios:
      url: https://apps.apple.com/app/bakasana/id6776696295
    android:
      url: https://play.google.com/store/apps/details?id=com.bakasana.bakasana_app

social_links:
  - id: instagram
    name: Instagram
    link_text: "@bakasana.app"
    url: https://www.instagram.com/bakasana.app/
    enabled: true
  - id: linkedin
    name: LinkedIn
    link_text: Bakasana
    url: https://www.linkedin.com/company/bakasana-app/
    enabled: true
  - id: youtube
    name: YouTube
    link_text: "@DaYogaAlena"
    url: https://www.youtube.com/@DaYogaAlena
    enabled: true
  - id: threads
    name: Threads
    url:
    enabled: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: pretty

exclude:
  - .gitignore
  - .github
  - Gemfile
  - Gemfile.lock
  - README.md
