title: Bakasana
description: Bakasana is a mobile yoga practice companion for iPhone and Android, built to help people practice consistently, track progress, and see their transformation over time.
description_ru: Bakasana — мобильное приложение и ваш напарник для регулярной йога-практики на iPhone и Android. Оно помогает заниматься последовательно, отслеживать прогресс и видеть изменения со временем.
url: https://bakasana.app
baseurl: ""
production_url: https://bakasana.app

app:
  version: 2.2.7
  build: 47
  category: HealthApplication
  operating_systems: "iOS, Android"
  stores:
    ios:
      url: https://apps.apple.com/app/bakasana/id6776696295
    android:
      url: https://play.google.com/store/apps/details?id=com.bakasana.bakasana_app

social_links:
  - id: instagram
    name: Instagram
    link_text: "@bakasana.app"
    url: https://www.instagram.com/bakasana.app/
    enabled: true
  - id: youtube
    name: YouTube
    url:
    enabled: false
  - id: threads
    name: Threads
    url:
    enabled: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: pretty

exclude:
  - .gitignore
  - .github
  - Gemfile
  - Gemfile.lock
  - README.md
