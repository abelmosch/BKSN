<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">b</span>
        <span class="brand-name">Bakasana</span>
      </a>
      <nav class="site-nav" aria-label="Site">
        <a href="{{ '/privacy/' | relative_url }}"{% if page.url contains '/privacy' %} aria-current="page"{% endif %}>Privacy</a>
        <span class="nav-sep" aria-hidden="true">/</span>
        <a href="{{ '/terms/' | relative_url }}"{% if page.url contains '/terms' %} aria-current="page"{% endif %}>Terms</a>
        <span class="nav-sep" aria-hidden="true">/</span>
        <a href="{{ '/delete-account/' | relative_url }}"{% if page.url contains '/delete-account' %} aria-current="page"{% endif %}>Delete account</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} Bakasana Industrial</p>
      <p><a href="mailto:bakasana.app@gmail.com">bakasana.app@gmail.com</a></p>
    </div>
  </footer>
</body>
</html>
