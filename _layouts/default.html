<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&amp;family=Hanken+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
</head>
<body{% if page.url == '/' %} class="home-page"{% endif %}>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="container container--wide header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Bakasana home">
        <span class="brand-mark" aria-hidden="true">b</span>
        <span class="brand-name">Bakasana</span>
        <span class="brand-status">Beta</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/#features' | relative_url }}">Features</a>
        <a href="{{ '/#programs' | relative_url }}">Programs</a>
        <a href="{{ '/#beta' | relative_url }}">Beta</a>
        <a href="{{ '/#support' | relative_url }}">Support</a>
      </nav>
    </div>
  </header>

  <main id="main-content"{% unless page.url == '/' %} class="container legal-main"{% endunless %}>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container container--wide footer-grid">
      <div class="footer-brand">
        <span class="brand-mark" aria-hidden="true">b</span>
        <div>
          <p class="footer-name">Bakasana</p>
          <p>Find your balance. Return to practice.</p>
        </div>
      </div>
      <nav class="footer-links" aria-label="Legal and support">
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/terms/' | relative_url }}">Terms</a>
        <a href="{{ '/delete-account/' | relative_url }}">Delete account</a>
        <a href="mailto:bakasana.app@gmail.com">Support</a>
      </nav>
      <div class="footer-meta">
        <span>iOS Beta / Android coming soon</span>
        <span>&copy; {{ site.time | date: '%Y' }} Bakasana Lab</span>
      </div>
    </div>
  </footer>
</body>
</html>
